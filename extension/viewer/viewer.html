<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title></title>
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <h1 id="title"></h1>
  <p id="stats" class="stats" hidden></p>
  <div class="export-bar">
    <label class="doc-title-field">
      <span id="doc-title-label"></span>
      <input id="doc-title" type="text" maxlength="200" autocomplete="off">
    </label>
    <button id="export-html" type="button" class="export-button"></button>
    <button id="export-docx" type="button" class="export-button"></button>
    <span id="export-status" class="tool-note" role="status"></span>
  </div>
  <div class="project-bar">
    <button id="project-save" type="button" class="project-button"></button>
    <button id="project-open" type="button" class="project-button"></button>
    <input id="project-file" type="file" accept=".json,application/json" hidden>
    <span id="project-status" class="tool-note" role="status"></span>
    <p id="project-hint" class="project-hint"></p>
  </div>
  <div class="toolbar">
    <button id="mask-mode" type="button" class="tool-button" aria-pressed="false"></button>
    <button id="area-mode" type="button" class="tool-button" aria-pressed="false"></button>
    <span id="mask-count" class="tool-note"></span>
  </div>
  <p id="mask-hint" class="mask-hint" hidden></p>
  <p id="empty" class="empty" hidden></p>
  <ol id="steps" class="steps"></ol>
  <details id="dropped" class="dropped-section" hidden>
    <summary id="dropped-title"></summary>
    <p id="dropped-hint" class="dropped-hint"></p>
    <ul id="dropped-steps" class="steps"></ul>
  </details>
  <script src="../shared/describe.js"></script>
  <script src="../shared/normalize.js"></script>
  <script src="../shared/mask.js"></script>
  <script src="../shared/groups.js"></script>
  <script src="../shared/crop.js"></script>
  <script src="../shared/zip.js"></script>
  <script src="../shared/docx.js"></script>
  <script src="../shared/html-export.js"></script>
  <script src="../shared/project.js"></script>
  <script src="viewer.js"></script>
  <script src="export.js"></script>
  <script src="project-file.js"></script>
</body>
</html>
